    z-index: 0;

  .video-moldura::after {
    content: "";
    position: absolute;
    inset: -40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(140, 194, 160, 0.16), transparent 65%);

    pointer-events: none;
  }
